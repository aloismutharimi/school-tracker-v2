services:
  - type: web
    name: school-tracker-v2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SCHOOL_TRACKER_ENV
        value: production
      - key: SCHOOL_TRACKER_DATA
        value: /opt/render/project/src/data
      - key: SCHOOL_TRACKER_SECRET
        generateValue: true